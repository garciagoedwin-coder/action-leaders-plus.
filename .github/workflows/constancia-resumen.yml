name: Resumen de constancia
on:
  # 23 nov: el horario pasó a Firebase (functions/reloj.js, relojCada15); aquí solo queda para correrlo a mano.
  workflow_dispatch:
    inputs:
      full: { description: "Completo (1)", default: "1" }
concurrency: constres
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
        working-directory: tools/push
      - name: Resumen
        working-directory: tools/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          FULL: ${{ github.event.inputs.full || (github.event.schedule == '7 8 * * *' && '1' || '') }}
        run: node constres.mjs
      - name: Mi Racha (adelantamientos y vidas)
        working-directory: tools/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node enviar.mjs rc3 || true
      - name: Lluvia de prospectos (respaldo del horario de lluvia.yml)
        working-directory: tools/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node enviar.mjs lluvia || true
