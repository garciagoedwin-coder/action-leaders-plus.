name: Aviso manual
on:
  push:
    branches: [main]
    paths: ["tools/push/disparo.json"]
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
        working-directory: tools/push
      - name: Enviar
        working-directory: tools/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          M=$(node -p 'require("./disparo.json").modo')
          D=$(node -p 'require("./disparo.json").dry?"1":""')
          DRY="$D" node enviar.mjs "$M"
