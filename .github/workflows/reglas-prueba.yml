name: Prueba de reglas (emulador)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund >/dev/null 2>&1
        working-directory: tools/test/reglas
      - run: cp ../../../respaldo/firestore.rules firestore.rules && npx firebase emulators:exec --only firestore --project demo-reglas "node test.mjs"
        working-directory: tools/test/reglas
