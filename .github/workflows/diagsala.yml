name: Diagnóstico avisos presentación virtual (temporal)
on: { workflow_dispatch: }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd tools/push && npm ci --no-audit --no-fund >/dev/null && node diagsala.mjs
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
      - name: Logs de la función (solo conteos)
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
        run: |
          umask 077; printf '%s' "$FIREBASE_SA" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json >/dev/null 2>&1
          gcloud logging read 'resource.type="cloud_function" AND resource.labels.function_name="salaCopiloto" AND timestamp>="'$(date -u -d '-72 hours' +%Y-%m-%dT%H:%M:%SZ)'"' --project action-leaders-plus-8f1b8 --limit 500 --format='value(timestamp,severity,textPayload)' > /tmp/l.txt 2>/tmp/e.txt || true
          echo "lineas: $(wc -l < /tmp/l.txt)"; echo "copiloto: $(grep -c copiloto /tmp/l.txt)"; echo "push falló: $(grep -c 'push falló' /tmp/l.txt)"; grep -o 'push falló [a-z/_-]*' /tmp/l.txt | sort | uniq -c; grep -o 'Function execution took [0-9]* ms, finished with status[^ ]* [^ ]*' /tmp/l.txt | sed 's/took [0-9]* ms, //' | sort | uniq -c; grep -c -i error /tmp/l.txt; head -c 300 /tmp/e.txt | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<c>/g'
          awk '{print substr($1,1,13)}' /tmp/l.txt | sort | uniq -c | tail -20
          rm -f /tmp/sa.json
