name: Diagnóstico link corto (página pública)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd tools/push && npm ci --no-audit --no-fund >/dev/null && node diagperf.mjs
        env: { FIREBASE_SA: "${{ secrets.FIREBASE_SA }}" }
