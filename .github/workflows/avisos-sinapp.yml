name: Aviso de socios nuevos sin app
# Cada día 9:47 a.m. HN: al patrocinador de cada socio activado (últimos 30 días) que aún no entra a la app, hasta que entre.
on:
  schedule:
    - cron: "47 15 * * *"
  workflow_dispatch:
    inputs:
      dry: { description: "1 = solo contar, no enviar", default: "1" }
concurrency: avisos-sinapp
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
        working-directory: tools/push
      - name: Enviar
        working-directory: tools/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry == '1' && '1' || '' }}
        run: node enviar.mjs sinapp
