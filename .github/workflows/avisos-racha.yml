name: Avisos de racha
on:
  # 23 nov: el horario pasó a Firebase (functions/reloj.js, relojCada15); aquí solo queda para correrlo a mano.
  workflow_dispatch:
    inputs:
      modo:
        description: "manana, racha, racha2 o fin"
        default: "racha"
      dry:
        description: "1 = solo mostrar, no enviar"
        default: "1"
concurrency: avisos-racha
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
        working-directory: tools/push
      - name: Enviar
        working-directory: tools/push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry == '1' && '1' || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then M="${{ inputs.modo }}";
          elif [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then M=racha2;
          elif [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then M=manana; else M=racha; fi
          node enviar.mjs "$M"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] || node enviar.mjs rhito || true
          [ "${{ github.event.schedule }}" = "30 3 * * *" ] && node enviar.mjs rc3top || true   # Mi Racha v3: top 3 del día   # metas de racha 7/14/21/30 → aviso a su línea de arriba
