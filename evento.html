<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Confirme su asistencia · Action Leaders+</title>
<meta name="description" content="Junta de negocios: confirme su asistencia en 10 segundos.">
<meta property="og:title" content="Le invito a una Junta de negocios 🤝">
<meta property="og:description" content="Descubra cómo viajar más, gastar menos y emprender desde su celular. Confirme aquí su asistencia.">
<meta property="og:image" content="https://actionleadersplus.com/media/eventos/f-j2.jpg">
<meta name="theme-color" content="#071526">

<style>
@font-face{font-family:BB;src:url(media/fonts/BebasNeue-Regular.ttf);font-display:swap}
@font-face{font-family:OB;src:url(media/fonts/Outfit-Bold.ttf);font-display:swap}
@font-face{font-family:OR;src:url(media/fonts/Outfit-Regular.ttf);font-display:swap}
*{box-sizing:border-box}button,input,select{font-family:inherit}
body{margin:0;font-family:OR,system-ui,sans-serif;background:#071526;color:#fff;-webkit-font-smoothing:antialiased}
.hero{position:relative;height:420px;background:#0B1B33 center 45%/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,21,38,.45),rgba(7,21,38,.2) 35%,rgba(7,21,38,.95) 85%,#071526)}
.logo{position:absolute;top:18px;left:50%;transform:translateX(-50%);height:30px}
.hc{position:absolute;left:18px;right:18px;bottom:14px;max-width:560px;margin:0 auto}
.pill{display:inline-block;background:#F5B700;color:#06101F;font:700 11px OB;letter-spacing:3px;padding:6px 12px;border-radius:20px}
h1{font:400 56px/.92 BB;margin:10px 0 4px;letter-spacing:.5px}h1 span{color:#2AC1F1}
.city{font:700 14px OB;letter-spacing:5px;color:#8FE3FF;text-transform:uppercase}
.w{max-width:560px;margin:0 auto;padding:0 18px 30px}
.inv{display:flex;gap:12px;align-items:center;background:rgba(42,193,241,.1);border:1px solid rgba(42,193,241,.35);border-radius:16px;padding:12px 14px;margin:6px 0 14px}
.av{width:46px;height:46px;border-radius:50%;background:#0A7DAD center/cover;display:grid;place-items:center;font:700 17px OB;border:2px solid #2AC1F1;flex:none}
.inv small{display:block;color:#9FB3C8;font-size:12px}.inv b{font:700 17px OB}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:11px 13px;min-width:0}
.c small{display:block;font:700 10px OB;letter-spacing:2px;color:#2AC1F1;margin-bottom:4px}.c b{font:700 17px OB}
.full{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub2{font-size:13px;color:#9FB3C8}
.map{background:#2AC1F1;color:#06101F;font:700 13px OB;border-radius:20px;padding:8px 12px;text-decoration:none;flex:none}
.an{margin:16px 0 8px;font:700 11px OB;letter-spacing:3px;color:#F5B700}
.hs{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:18px}.h{display:flex;align-items:center;gap:8px;font:700 13px OB}.h .av{width:34px;height:34px;font-size:12px}
.f{background:#fff;color:#0B1B33;border-radius:20px;padding:18px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.f h3{margin:0 0 4px;font:700 20px OB}.f p{margin:0 0 12px;color:#5B6B80;font-size:14px;line-height:1.45}
label{display:block;font:700 12px OB;color:#0B1B33;margin:10px 0 5px}
input,select{width:100%;border:1.5px solid #E2E8F0;border-radius:12px;padding:13px;font-size:16px;color:#0B1B33;background:#fff}
input:focus,select:focus{outline:none;border-color:#2AC1F1}
.row2{display:flex;gap:8px}.row2 select{width:118px;flex:none}
.btn{display:block;margin-top:14px;width:100%;border:0;border-radius:14px;padding:15px;font:800 17px OB;background:linear-gradient(90deg,#F59E0B,#FDE047);color:#1C1917;cursor:pointer;text-align:center;text-decoration:none}
.btn:disabled{opacity:.6}
.err{color:#DC2626;font-size:13px;margin-top:8px;min-height:1em}
.foot{text-align:center;color:#9FB3C8;font-size:12px;margin:14px 0 0;line-height:1.5}
.ok{text-align:center;padding:14px 4px 4px}.ok .ck{width:72px;height:72px;border-radius:50%;background:#16A34A;display:grid;place-items:center;margin:0 auto 12px;font-size:36px;color:#fff}
.ok h3{font:700 24px OB;margin:0 0 6px}.ok p{color:#5B6B80;font-size:15px}
.b2{display:block;margin-top:10px;border-radius:14px;padding:13px;font:700 15px OB;border:1.5px solid #0A7DAD;color:#0A7DAD;text-align:center;text-decoration:none;background:#fff}
.b3{display:block;margin-top:10px;border-radius:14px;padding:13px;font:700 15px OB;background:#25D366;color:#fff;text-align:center;text-decoration:none}
.bad{padding:80px 20px;text-align:center}
</style></head><body>
<div id="app"></div>
<script type="module">
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini=n=>String(n||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],DIA=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
let E=null;try{let s=new URLSearchParams(location.search).get("i")||"";s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);E=JSON.parse(new TextDecoder().decode(u))}catch(e){E=null}
let db=null,fs=null;
async function fb(){if(db)return;const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");fs=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app=initializeApp({apiKey:"AIzaSyA0ehZ7NNzLE46Ifs-kvWXVVYfsohpdPXM",authDomain:"action-leaders-plus-8f1b8.firebaseapp.com",projectId:"action-leaders-plus-8f1b8",storageBucket:"action-leaders-plus-8f1b8.firebasestorage.app",messagingSenderId:"782054956613",appId:"1:782054956613:web:a34f683a893d00b9980d2c"});db=fs.getFirestore(app)}
let PX=null;
(async()=>{
// 9 nov: link corto ?p=CODIGO&e=CLAVE → los datos están en la página pública del socio (perfiles/{p}.ev[e]); 1 lectura (la misma que ya se hacía para la foto)
if(!E){const q=new URLSearchParams(location.search),p=q.get("p"),k=q.get("e");if(p&&k){try{await fb();const d=await fs.getDoc(fs.doc(db,"perfiles",p));if(d.exists()){PX=d.data()||{};const o=(PX.ev||{})[k];if(o&&typeof o==="object"){E=Object.assign({},o,{p,a:(o.a||[]).map(x=>Array.isArray(x)?x:String(x).split("|"))})}}}catch(e){}}}
if(!E||!E.e||!E.f){$("#app").innerHTML=`<div class="bad"><h2>Enlace incompleto</h2><p>Pídale de nuevo la invitación a la persona que se la envió.</p></div>`;return}
const gran=E.tp==="gran",tipo=gran?"Gran evento de negocios":"Junta de negocios",[Y,M,D]=E.f.split("-").map(Number),fd=new Date(Y,M-1,D);
const [hh,mm]=String(E.h||"00:00").split(":").map(Number),h12=(hh%12||12)+":"+String(mm).padStart(2,"0")+(hh<12?" a.m.":" p.m.");
const fechaL=DIA[fd.getDay()]+" "+D+" de "+MES[M-1],fechaC=DIA[fd.getDay()].slice(0,3).replace(/^./,c=>c.toUpperCase())+" "+D+" de "+MES[M-1].slice(0,3)+".";
const dn=E.dn||"",dn1=dn.split(" ")[0]||"";
const ds=[1,2,3].includes(+E.ds)?+E.ds:1,bg="media/eventos/f-"+(gran?"g":"j")+ds+".jpg"+(gran?"":"?v=3");
document.title=tipo+" · Confirme su asistencia";
$("#app").innerHTML=`<div class="hero" style="background-image:url('${bg}')"><img class="logo" src="media/logo-al.png" alt="Action Leaders+"><div class="hc"><span class="pill">${E.z?"VIRTUAL":"PRESENCIAL"}</span><h1>${gran?"GRAN EVENTO <span>DE NEGOCIOS</span>":"JUNTA DE <span>NEGOCIOS</span>"}</h1><div class="city">${esc(E.c||(E.z?"En línea":""))}</div></div></div>
<div class="w">
 ${dn?`<div class="inv"><div class="av" id="dav">${esc(ini(dn))}</div><div><small>Le invita</small><b>${esc(dn)}</b></div></div>`:""}
 <div class="grid"><div class="c"><small>FECHA</small><b>${esc(fechaC)}</b></div><div class="c"><small>HORA</small><b>${esc(h12)} 🇭🇳</b></div>
 <div class="c full"><div style="min-width:0"><small>LUGAR</small><b>${E.z?"🎥 Por Zoom":"📍 "+esc(E.l||"")}</b>${!E.z&&E.ls?`<div class="sub2">${esc(E.ls)}</div>`:""}${E.z?`<div class="sub2">Le enviaremos el enlace por WhatsApp</div>`:""}</div>${!E.z&&E.m&&/^https:\/\//.test(E.m)?`<a class="map" href="${esc(E.m)}" target="_blank" rel="noopener">📍 Mapa</a>`:""}</div></div>
 ${(E.a||[]).length?`<div class="an">${gran?"INVITADOS":"ANFITRIONES"}</div><div class="hs">${E.a.map(x=>`<div class="h"><div class="av">${esc(ini(x[0]))}</div>${esc(x[0])}${x[1]==="esp"?" ⭐":""}</div>`).join("")}</div>`:""}
 <div class="f" id="F"></div>
 <p class="foot">Descubra cómo viajar más, gastar menos y emprender desde su celular.<br>Action Leaders+</p>
</div>`;
const K="rsvp:"+E.e;
const gcal=()=>{const a=new Date(Date.UTC(Y,M-1,D,hh+6,mm)),b=new Date(a.getTime()+2*36e5),g=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(tipo+" · Action Leaders")+"&dates="+g(a)+"/"+g(b)+"&location="+encodeURIComponent(E.z?"Zoom":[E.l,E.ls,E.c].filter(Boolean).join(", "))+"&details="+encodeURIComponent(dn?"Le invitó: "+dn:"")};
let WA="";
function listo(n){const f=String(n||"").trim().split(/\s+/)[0];
  $("#F").innerHTML=`<div class="ok"><div class="ck">✓</div><h3>¡Listo${f?", "+esc(f):""}!</h3><p>Le esperamos el ${esc(fechaL)} a las ${esc(h12)}${dn1?`<br>${esc(dn1)} ya sabe que usted va. 🙌`:""}</p></div>
  <a class="b2" href="${gcal()}" target="_blank" rel="noopener">📅 Agregar a mi calendario</a>${WA?`<a class="b3" href="https://wa.me/${WA}?text=${encodeURIComponent("¡Hola"+(dn1?" "+dn1:"")+"! Ya confirmé mi asistencia a la "+tipo.toLowerCase()+" del "+fechaL+". 🙌")}" target="_blank" rel="noopener">💬 Escribirle a ${esc(dn1||"quien me invitó")}</a>`:""}`}
function form(){$("#F").innerHTML=`<h3>Confirme su asistencia</h3><p>Solo le toma 10 segundos. El cupo es limitado.</p>
 <label for="n">Su nombre</label><input id="n" autocomplete="name" maxlength="60" placeholder="Nombre y apellido">
 <label for="t">Su WhatsApp</label><div class="row2"><select id="cc"><option value="504">🇭🇳 +504</option><option value="502">🇬🇹 +502</option><option value="503">🇸🇻 +503</option><option value="505">🇳🇮 +505</option><option value="506">🇨🇷 +506</option><option value="507">🇵🇦 +507</option><option value="52">🇲🇽 +52</option><option value="1">🇺🇸 +1</option><option value="34">🇪🇸 +34</option><option value="44">🇬🇧 +44</option></select><input id="t" type="tel" inputmode="tel" autocomplete="tel" placeholder="Número"></div>
 <button class="btn" id="ok">✅ Confirmo mi asistencia</button><div class="err" id="er"></div>`;
 $("#ok").onclick=enviar}
async function enviar(){const n=$("#n").value.trim().replace(/\s+/g," "),cc=$("#cc").value,t=$("#t").value.replace(/\D/g,""),er=$("#er");er.textContent="";
  if(n.length<2){er.textContent="Escriba su nombre.";$("#n").focus();return}if(t.length<7){er.textContent="Escriba su número de WhatsApp.";$("#t").focus();return}
  const b=$("#ok");b.disabled=true;b.textContent="Confirmando…";
  try{await fb();await fs.addDoc(fs.collection(db,"agendaEv",E.e,"rsvp"),{n:n.slice(0,60),w:t.slice(0,15),cc:cc.slice(0,4),de:String(E.d||"").slice(0,64),dn:dn.slice(0,60),t:Date.now()});
    try{localStorage.setItem(K,n)}catch(e){}listo(n)}
  catch(e){b.disabled=false;b.textContent="✅ Confirmo mi asistencia";er.textContent="No se pudo confirmar. Revise su conexión e intente de nuevo."}}
let ya=null;try{ya=localStorage.getItem(K)}catch(e){}
if(ya)listo(ya);else form();
// Foto y WhatsApp de quien invita (página pública del socio): 1 lectura, opcional
if(E.p){(async()=>{try{let x=PX;if(!x){await fb();const d=await fs.getDoc(fs.doc(db,"perfiles",E.p));if(!d.exists())return;x=d.data()||{}}
  if(x.foto&&/^(data:image|https:)/.test(x.foto)){const a=$("#dav");if(a){a.style.backgroundImage="url('"+x.foto.replace(/'/g,"")+"')";a.textContent=""}}
  WA=String(x.wa||x.waS||"").replace(/\D/g,"");if(WA&&$(".ok"))listo(ya||(()=>{try{return localStorage.getItem(K)}catch(e){return""}})())}catch(e){}})()}
})();
</script>
</body></html>
