<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Banner Networker Pro · maqueta</title>
<style>
@font-face{font-family:P;src:url(../../media/fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:F;src:url(../../media/fonts/Figtree-VF.ttf);font-weight:100 900}
@font-face{font-family:B;src:url(../../media/fonts/BarlowCondensed-Bold.ttf);font-weight:700}
:root{--ce:#2AC1F1;--br:#0A7DAD;--au:#E8B54A}
*{box-sizing:border-box;margin:0}
body{background:#DCE3EA;font-family:F,sans-serif;padding:40px;display:flex;gap:36px;width:max-content}
.cap{font-family:P;font-size:15px;color:#4A5563;margin:0 0 12px 6px}
.ph{width:430px;height:932px;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(10,30,60,.18)}
.L{--bg:#F3F6F9;--sf:#fff;--ink:#2B2A2D;--mu:#6B7380;--ln:#E2E8EF}
.D{--bg:#0E141C;--sf:#17202B;--ink:#E8EEF4;--mu:#94A3B8;--ln:#26313F}
.ph{background:var(--bg);color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 6px}
.logo{font-family:'Times New Roman',serif;font-style:italic;font-size:19px;font-weight:700}
.av{width:40px;height:40px;border-radius:50%;background:var(--ce);display:flex;align-items:center;justify-content:center;font-family:P;font-size:14px;color:#0B1220}
.pad{padding:0 20px}
.k{font-family:P;font-size:11px;letter-spacing:.14em;color:var(--mu);margin-top:16px}
h1{font-family:P;font-size:30px;margin:2px 0 8px}
h1 b{color:var(--ce)}
.pills{display:flex;gap:8px;margin-bottom:14px}
.pills span{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:6px 11px;font-size:12.5px;font-family:P}
/* BANNER */
.npb{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:18px 18px 16px;
 background:radial-gradient(90% 120% at 100% 0%,rgba(42,193,241,.35) 0%,rgba(42,193,241,0) 55%),linear-gradient(160deg,#0D2A44 0%,#0B1220 70%);
 box-shadow:0 14px 34px rgba(11,18,32,.28),inset 0 0 0 1px rgba(42,193,241,.25)}
.npb:before{content:"";position:absolute;right:-24px;bottom:-34px;width:190px;height:190px;background:url(../../media/casco.png) center/contain no-repeat;opacity:.09}
.npb .x{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.85}
.npb .tg{display:inline-flex;align-items:center;gap:6px;font-family:P;font-size:10.5px;letter-spacing:.16em;color:#0B1220;background:var(--ce);padding:4px 9px;border-radius:20px}
.npb .tg i{width:7px;height:7px;border-radius:50%;background:#E11D48;box-shadow:0 0 0 3px rgba(225,29,72,.25)}
.npb .tt{font-family:P;font-size:38px;line-height:.95;margin:12px 0 4px;letter-spacing:.01em}
.npb .tt b{color:var(--ce)}
.npb .sb{font-size:13.5px;opacity:.85;line-height:1.4;max-width:330px}
.npb .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.npb .chips span{font-size:11.5px;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.npb .rw{display:flex;gap:8px;margin-top:2px}
.npb .rw div{flex:1;border-radius:14px;padding:9px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:11.5px;line-height:1.3;opacity:.95}
.npb .rw b{display:block;font-family:P;font-size:13px;color:#fff}
.npb .rw .au b{color:var(--au)}
.npb .go{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;background:var(--ce);color:#0B1220;font-family:P;font-size:15px;padding:13px;border-radius:14px}
.npb .ft{text-align:center;font-size:11.5px;opacity:.6;margin-top:8px}
.conf{position:absolute;inset:0;pointer-events:none}
.conf i{position:absolute;width:7px;height:12px;border-radius:2px;opacity:.9}
/* debajo */
.cp{margin-top:12px;border-radius:20px;padding:14px 16px;background:linear-gradient(135deg,#0B1F33,#0A4A6E);color:#fff;font-size:12.5px;opacity:.95}
.cp b{font-family:P;font-size:14px;display:block}
.rut{margin-top:12px;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px 16px}
.rut h3{font-family:P;font-size:15px;margin-bottom:8px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}
.it .c{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);flex-shrink:0}
.it .c.ok{background:#16A34A;border-color:#16A34A}
.it.np{background:linear-gradient(90deg,rgba(42,193,241,.12),rgba(42,193,241,0));margin:0 -16px;padding:9px 16px}
.it .tx{flex:1}.it .tx small{display:block;color:var(--mu);font-size:11.5px}
.it .bt{font-family:P;font-size:12px;background:var(--br);color:#fff;padding:7px 11px;border-radius:10px;white-space:nowrap}
.nav{position:absolute;left:18px;right:18px;bottom:14px;height:62px;background:var(--sf);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.1);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:var(--mu)}
.nav .on{color:var(--br);font-family:P}
</style></head><body>
<script>
function ph(cls,cap){document.write(`<div><p class="cap">${cap}</p><div class="ph ${cls}">
 <div class="top"><span class="logo">Action ⛑ Leaders</span><span class="av">JS</span></div>
 <div class="pad">
  <p class="k">JUEVES 12 DE NOVIEMBRE</p><h1>Hola, <b>Joel</b> 👋</h1>
  <div class="pills"><span>● Ahorro al día</span><span>⚡ Personal 60%</span><span>👥 Equipo 42%</span></div>
  <div class="npb">
   <div class="conf">${Array.from({length:18},(_,i)=>`<i style="left:${(i*53)%100}%;top:${(i*37)%60-5}%;background:${['#2AC1F1','#E8B54A','#fff','#0A7DAD'][i%4]};transform:rotate(${i*41}deg)"></i>`).join('')}</div>
   <span class="x">✕</span>
   <span class="tg"><i></i>NUEVO · ACADEMIA</span>
   <div class="tt">NETWORKER <b>PRO</b></div>
   <div class="sb">El curso para convertirse en un networker profesional. 8 videos, 8 habilidades.</div>
   <div class="chips"><span>🧠 Mentalidad</span><span>📇 Lista</span><span>💬 Invitación</span><span>🎤 Presentación</span><span>🤝 Cierre</span><span>⭐ Liderazgo</span></div>
   <div class="rw"><div><b>📅 1 video al día</b>Ya es parte de su rutina en «Aliméntese»</div><div class="au"><b>🎓 Su diploma</b>Al terminar los 8, con sus insignias</div></div>
   <div class="go">▶ Ver el video 1</div>
   <div class="ft">Hoy empieza su camino de networker pro · #HASTAQUEFUNCIONE</div>
  </div>
  <div class="cp"><b>🎯 Mi compromiso de noviembre</b>Marketing Director · ⚡ 500 pts · 🎤 3 esta semana</div>
  <div class="rut"><h3>🔥 Su rutina de hoy · 1 de 5</h3>
   <div class="it"><span class="c ok"></span><div class="tx">Publique sus 2 historias del día</div></div>
   <div class="it np"><span class="c"></span><div class="tx">🎓 Vea su video de hoy<small>Networker Pro · 1 · Mentalidad y rutina</small></div><span class="bt">▶ Ver</span></div>
  </div>
 </div>
 <div class="nav"><span class="on">Inicio</span><span>Equipo</span><span>CRM</span><span>Agenda</span><span>Academia</span><span>Sueños</span></div>
</div></div>`)}
ph('L','Modo claro');ph('D','Modo oscuro');
</script>
</body></html>
