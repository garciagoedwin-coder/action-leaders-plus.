<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#E9EEF3;font-family:Figtree,system-ui,sans-serif;color:#2B2A2D;display:flex;gap:28px;padding:28px;align-items:flex-start}
.ph{width:430px;background:#F3F6F9;border-radius:34px;padding:18px 14px 20px;box-shadow:0 10px 30px #0002}
.tt{font:800 15px system-ui;color:#0A7DAD;letter-spacing:.06em;margin:0 6px 4px;text-transform:uppercase}.sb{font-size:13px;color:#55606b;margin:0 6px 10px}
.card{border:2px solid #0A7DAD;border-radius:22px;background:#EAF3F9;overflow:hidden}
.hd{display:flex;align-items:center;gap:12px;padding:14px;background:#F3F7FA}
.av{width:52px;height:52px;border-radius:50%;background:#CDEBF7;display:grid;place-items:center;font-weight:800;color:#0b3b57}
.nm{font-weight:800;font-size:20px}.tel{color:#55606b;font-size:14px}.tel b{color:#0A7DAD}
.rb{margin-left:auto;display:flex;gap:6px}.rb span{width:34px;height:34px;border-radius:50%;border:1px solid #d7dee5;background:#fff;display:grid;place-items:center;font-size:14px}
.bd{padding:12px}
.k{font-size:11px;font-weight:800;letter-spacing:.12em;color:#55606b;margin:0 2px 6px;display:flex;justify-content:space-between}.k b{color:#16A34A;letter-spacing:0}
/* A: segmentos */
.sa{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border:1px solid #dfe6ec;border-radius:14px;padding:4px}
.sa span{border-radius:10px;padding:7px 2px;text-align:center;font-size:12.5px;font-weight:700;color:#55606b;white-space:nowrap}
.sa span.ok{background:#16A34A;color:#fff}
/* B: escalones */
.sbw{display:flex;align-items:flex-start;background:#fff;border:1px solid #dfe6ec;border-radius:14px;padding:10px 6px 8px}
.st{flex:1;text-align:center;position:relative}
.st i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto;border-radius:50%;background:#EEF2F5;font-style:normal;font-size:16px;border:2px solid #dfe6ec;position:relative;z-index:1}
.st.ok i{background:#DCFCE7;border-color:#16A34A}.st.ok i::after{content:"✓";position:absolute;right:-5px;bottom:-4px;width:15px;height:15px;border-radius:50%;background:#16A34A;color:#fff;font-size:10px;display:grid;place-items:center;font-weight:900}
.st small{display:block;font-size:11.5px;font-weight:700;color:#55606b;margin-top:4px;white-space:nowrap}.st.ok small{color:#166534}
.st+.st::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:2px;background:#dfe6ec}
.st.ok+.st.ok::before{background:#16A34A}
/* C: pills chicas */
.sc{display:flex;gap:5px}.sc span{flex:1;text-align:center;border:1px solid #d7dee5;background:#fff;border-radius:99px;padding:6px 0;font-size:12px;font-weight:700;white-space:nowrap}
.sc span.ok{background:#DCFCE7;border-color:#86EFAC;color:#166534}
.row{display:flex;gap:8px;margin-top:12px}.g{flex:1.4;background:#25D366;color:#fff;border-radius:14px;padding:13px;font-weight:800;text-align:center}
.o{flex:1;border:2px solid #0A7DAD;color:#0A7DAD;border-radius:14px;padding:11px;font-weight:800;text-align:center;background:#fff}
.pv{margin-top:8px;border-radius:14px;padding:12px;font-weight:800;text-align:center;font-size:15px;background:#fff;border:2px dashed #0A7DAD;color:#0A7DAD}
</style></head><body>
<script>
const hd=`<div class="hd"><div class="av">FR</div><div><div class="nm">Fany Ruiz</div><div class="tel">+504 3172-1696 · <b>Copiar</b></div></div><div class="rb"><span>⋯</span><span>🗑️</span><span>✕</span></div></div>`;
const tail=`<div class="row"><div class="g">💬 Saludar en WhatsApp</div><div class="o">✍️ Anotar</div></div><div class="pv">✈️ Enviarle mi presentación virtual</div>`;
const k=`<div class="k"><span>CÓMO SE LE HA PRESENTADO</span><b>2 de 4</b></div>`;
const ops=[
["Opción A · Barra de 4","Una sola barra; en verde las que ya tuvo.",`${k}<div class="sa"><span class="ok">✈️ Virtual</span><span class="ok">🤝 1 a 1</span><span>🌎 Zoom</span><span>🎤 Junta</span></div>`],
["Opción B · Como etapas","Círculos unidos por una línea; ✓ verde en las que ya tuvo.",`${k}<div class="sbw"><div class="st ok"><i>✈️</i><small>Virtual</small></div><div class="st ok"><i>🤝</i><small>1 a 1</small></div><div class="st"><i>🌎</i><small>Zoom</small></div><div class="st"><i>🎤</i><small>Junta/Evento</small></div></div>`],
["Opción C · Pastillas chicas","Las mismas de hoy, más pequeñas, en una línea.",`${k}<div class="sc"><span class="ok">✈️ Virtual</span><span class="ok">🤝 1 a 1</span><span>🌎 Zoom</span><span>🎤 Junta</span></div>`]];
document.write(ops.map(([t,s,h])=>`<div class="ph"><div class="tt">${t}</div><div class="sb">${s}</div><div class="card">${hd}<div class="bd">${h}${tail}</div></div></div>`).join(""));
</script></body></html>
