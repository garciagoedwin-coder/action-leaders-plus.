<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Nuevo rango (maqueta, todos los rangos)</title>
<style>
@font-face{font-family:P;src:url(../../../media/fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:F;src:url(../../../media/fonts/Figtree-VF.ttf);font-weight:100 900}
@font-face{font-family:B;src:url(../../../media/fonts/BarlowCondensed-Bold.ttf);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#cfd6dc;display:flex;gap:40px;padding:40px;width:max-content;font-family:F,sans-serif}
.f{position:relative;width:1080px;height:1920px;overflow:hidden;color:#fff;
 background:radial-gradient(70% 40% at 50% 42%,rgba(var(--g),.55),rgba(var(--g),0) 70%),
 radial-gradient(60% 30% at 100% 0%,rgba(var(--g2),.25),transparent 70%),
 linear-gradient(180deg,var(--b0) 0%,var(--b1) 40%,var(--b2) 62%,var(--b0) 100%)}
.f.p{height:1350px}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 44%,rgba(255,255,255,.045) 0deg 4deg,transparent 4deg 14deg);mask:radial-gradient(60% 45% at 50% 44%,#000 20%,transparent 75%);-webkit-mask:radial-gradient(60% 45% at 50% 44%,#000 20%,transparent 75%)}
.f.p .rays{background:repeating-conic-gradient(from 0deg at 50% 47%,rgba(255,255,255,.045) 0deg 4deg,transparent 4deg 14deg)}
.wm{position:absolute;left:50%;top:44%;width:900px;height:900px;transform:translate(-50%,-50%);background:var(--c1);opacity:.06;-webkit-mask:url(../../../media/casco.png) center/contain no-repeat;mask:url(../../../media/casco.png) center/contain no-repeat}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:190px 70px 210px}
.f.p .in{padding:64px 70px 50px}
.logo{height:64px}
.k{margin-top:38px;display:inline-flex;align-items:center;gap:14px;font-weight:800;font-size:28px;letter-spacing:.32em;color:var(--tx);background:linear-gradient(90deg,var(--c1),var(--c2));padding:12px 26px 12px 30px;border-radius:999px;box-shadow:0 10px 30px rgba(var(--g),.35)}
.f.p .k{margin-top:40px;font-size:22px}
h1{font-family:P;font-weight:600;font-size:112px;line-height:.95;margin-top:26px;letter-spacing:.01em;text-shadow:0 8px 40px rgba(0,0,0,.35)}
h1 b{display:block;font-weight:600;background:linear-gradient(180deg,var(--c0),var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent}
.f.p h1{font-size:86px;margin-top:20px}
.ph{position:relative;flex:none;margin-top:52px;width:430px;height:430px}
.f.p .ph{margin-top:40px;width:360px;height:360px}
.ph:before{content:"";position:absolute;inset:-26px;border-radius:50%;background:conic-gradient(from 200deg,var(--c0),var(--c2),var(--c3),var(--c1),var(--c0));filter:drop-shadow(0 0 40px rgba(var(--g),.55))}
.ph:after{content:"";position:absolute;inset:-12px;border-radius:50%;background:var(--b1)}
.ph img.fo{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;z-index:1}
.pin{position:absolute;left:50%;bottom:-88px;width:215px;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55))}
.f.p .pin{width:180px;bottom:-74px}
.nm{font-family:P;font-weight:600;font-size:74px;margin-top:100px;line-height:1.05}
.f.p .nm{font-size:56px;margin-top:88px}
.ln{display:flex;align-items:center;gap:14px;margin:22px 0 0;color:var(--c1);font-weight:800;font-size:26px;letter-spacing:.3em}
.ln i{width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--c1))}.ln i:last-child{transform:scaleX(-1)}
.sb{font-size:35px;line-height:1.35;color:rgba(255,255,255,.88);margin-top:24px;max-width:900px;text-wrap:balance}
.sb b{color:#fff}
.f.p .sb{font-size:28px;margin-top:16px}
.lad{display:flex;gap:9px;margin-top:34px;flex-wrap:wrap;justify-content:center;max-width:900px}
.lad{align-items:center;flex-wrap:nowrap}.lad i{font-style:normal;color:rgba(255,255,255,.35);font-size:26px}.ladT{margin-top:12px;font-size:20px;font-weight:700;letter-spacing:.28em;color:rgba(255,255,255,.5)}.f.p .ladT{display:none}
.lad.mu{gap:6px}.lad.mu span{font-size:26px;padding:7px 12px}.lad.mu i{font-size:20px}
.lad span{white-space:nowrap;font-family:B;font-size:31px;letter-spacing:.08em;padding:8px 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.16);color:rgba(255,255,255,.55);background:rgba(255,255,255,.04)}
.lad span.on{background:var(--c2);border-color:var(--c2);color:var(--tx);box-shadow:0 0 24px rgba(var(--g),.5)}.lad span.ya{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.35)}
.sp{flex:1}
.ft{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;margin-top:40px;font-size:22px;letter-spacing:.24em;color:rgba(255,255,255,.65)}
.ft b{font-family:P;font-weight:600;color:#fff;font-size:38px;letter-spacing:.04em;order:-1}
.f.p .lad,.f.p .sp{display:none}.f.p .ft{margin-top:30px}.f.p .ft b{font-size:28px}
</style></head><body>
<script>
// Colores por rango (pines de inCruises). Llave: md smd rd nd id ed bod
const R={
 md:{t:["MARKETING","DIRECTOR"],c0:"#DCFCE7",c1:"#86EFAC",c2:"#22C55E",c3:"#15803D",tx:"#062B12",g:"52,211,113",g2:"134,239,172",b0:"#03140b",b1:"#06301a",b2:"#0a4a26"},
 smd:{t:["SENIOR MARKETING","DIRECTOR"],c0:"#DBEAFE",c1:"#93C5FD",c2:"#3B82F6",c3:"#1D4ED8",tx:"#04153D",g:"59,130,246",g2:"147,197,253",b0:"#030a1c",b1:"#071a44",b2:"#0b2a6b"},
 rd:{t:["REGIONAL","DIRECTOR"],c0:"#FFEDD5",c1:"#FDBA74",c2:"#F97316",c3:"#C2410C",tx:"#3A1503",g:"249,115,22",g2:"253,186,116",b0:"#170802",b1:"#3a1606",b2:"#5e240a"},
 nd:{t:["NATIONAL","DIRECTOR"],c0:"#FFE4E6",c1:"#FDA4AF",c2:"#E11D48",c3:"#9F1239",tx:"#3B0412",g:"225,29,72",g2:"253,164,175",b0:"#160308",b1:"#3d0716",b2:"#640b24"},
 id:{t:["INTERNATIONAL","DIRECTOR"],c0:"#F3E8FF",c1:"#D8B4FE",c2:"#9333EA",c3:"#6B21A8",tx:"#24063F",g:"147,51,234",g2:"216,180,254",b0:"#0d0418",b1:"#250b45",b2:"#3b1170"},
 ed:{t:["EXECUTIVE","DIRECTOR"],c0:"#FFFFFF",c1:"#E5E7EB",c2:"#9CA3AF",c3:"#4B5563",tx:"#0B0B0C",g:"200,205,214",g2:"229,231,235",b0:"#050506",b1:"#141518",b2:"#25272c"},
 bod:{t:["BOARD OF","DIRECTORS"],c0:"#FEF9C3",c1:"#FDE68A",c2:"#EAB308",c3:"#A16207",tx:"#2A1A02",g:"234,179,8",g2:"253,230,138",b0:"#0c0822",b1:"#1c1550",b2:"#2a1f7a"}};
const K=["md","smd","rd","nd","id","ed","bod"],AB=["MD","SMD","RD","ND","ID","ED","BOD"];
const q=new URLSearchParams(location.search),rk=q.get("r")||"md",V=R[rk],ix=K.indexOf(rk);
function F(cls){const st=Object.entries(V).filter(([k])=>k!=="t").map(([k,v])=>`--${k}:${v}`).join(";");
 const lad=AB.map((a,i)=>`<span class="${i===ix?"on":i<ix?"ya":""}">${i<=ix?"✓ ":""}${a}</span>`).join("<i>›</i>");
 document.write(`<div><div class="f ${cls}" style="${st}"><div class="rays"></div><div class="wm"></div><div class="in">
 <img class="logo" src="../diploma-tl/logo-blanco.png">
 <span class="k">★ NUEVO RANGO</span>
 <h1 style="${V.t[0].length>12?"font-size:"+(cls?66:84)+"px":""}">${V.t[0]}<b style="${V.t[0].length>12?"font-size:"+(cls?86:112)+"px":""}">${V.t[1]}</b></h1>
 <div class="ph"><img class="fo" src="/tmp-foto.jpg"><img class="pin" src="../../../media/cert/pin-${rk}.png"></div>
 <div class="nm">${q.get("n")||"Karla Calderón"}</div>
 <div class="ln"><i></i>${rk==="md"?"SU PRIMER RANGO EN INCRUISES":"NUEVO RANGO EN INCRUISES"}<i></i></div>
 <p class="sb">¡Felicidades! Lo que construyó con <b>disciplina y liderazgo</b> hoy tiene nombre.<br>Este es solo el comienzo.</p>
 <div class="lad${ix>=3?" mu":""}">${lad}</div><div class="ladT">SU CAMINO DE RANGOS EN INCRUISES</div>
  <div class="ft"><span>CAMINO A MI LIBERTAD</span><b>#HASTAQUEFUNCIONE</b></div>
</div></div></div>`)}
F("");F("p");
</script></body></html>
